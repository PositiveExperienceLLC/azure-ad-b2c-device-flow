stages:
  - stage: Integration
    jobs:
      - job: Integration
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: self
            displayName: Checkout Repository
            persistCredentials: true

          - task: UseDotNet@2
            displayName: Install .NET 8
            inputs:
              version: '8.x'

          - task: NuGetAuthenticate@0
            displayName: Authenticate to Private Feed

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              arguments: -c Release

          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
              nobuild: true
              arguments: -c Release

          - task: DotNetCoreCLI@2
            displayName: Publish
            inputs:
              command: publish
              nobuild: true
              zipAfterPublish: false
              modifyOutputPath: false
              publishWebProjects: false
              projects: src/DeviceAuthService/DeviceAuthService.csproj
              arguments: -c Release -o out

          # ArchiveFiles keeps dot-folders; Compress-Archive on Linux skips them, which drops the
          # isolated worker's .azurefunctions extension folder and leaves the host with no functions
          - task: ArchiveFiles@2
            displayName: Archive
            inputs:
              rootFolderOrFile: out
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/$(Build.BuildNumber).zip

          - task: CopyFiles@2
            displayName: Copy Azure Resource Templates
            inputs:
              SourceFolder: build/azure
              TargetFolder: $(Build.ArtifactStagingDirectory)/arm
              preserveTimestamp: true

          - publish: $(Build.ArtifactStagingDirectory)
            displayName: Publish Build Artifacts
            artifact: Drop